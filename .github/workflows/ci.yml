name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  backend:
    name: Backend (evolyn-core)
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    defaults:
      run:
        working-directory: apps/evolyn-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/evolyn-core/go.mod
          cache-dependency-path: apps/evolyn-core/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -coverprofile=cover.out
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi

  frontend:
    name: Frontend (evolyn-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/evolyn-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/evolyn-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
