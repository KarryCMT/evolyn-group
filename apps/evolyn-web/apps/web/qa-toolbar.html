<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard toolbar QA</title>
    <style>
      html,
      body,
      #app,
      .qa-page {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .qa-page {
        position: relative;
        background: #eef2f5;
      }

      .qa-center-line {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
        pointer-events: none;
        background: #ff4d4f;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/qa-toolbar.ts"></script>
  </body>
</html>
