# 生产部署配置。字段定义、顺序与填写说明统一以 app.example.yaml 为准。
# 所有 CHANGE_ME 必须由部署密钥管理系统替换，禁止提交真实值。
server:
  env: 'release'
  address: '0.0.0.0'
  port: 8080
  gracefulShutdownPeriod: 30
  rateLimits:
    - limitType: 'server'
      burst: 500
      qps: 100
      cacheSize: 1
    - limitType: 'ip'
      burst: 50
      qps: 10
      cacheSize: 2048
  jwtSecret: 'CHANGE_ME'
  allowedOrigins:
    - 'https://www.lingyanyun.com'

db:
  host: 'CHANGE_ME'
  port: 5432
  name: 'evolyn'
  user: 'CHANGE_ME'
  password: 'CHANGE_ME'
  migrate: false
  migrations: true

tenant:
  retentionDays: 30
  purgeIntervalSeconds: 3600

redis:
  enable: true
  host: 'CHANGE_ME'
  port: 6379
  password: 'CHANGE_ME'

storage:
  enabled: true
  endpoint: 'CHANGE_ME'
  externalEndpoint: 'https://files.lingyanyun.com'
  accessKey: 'CHANGE_ME'
  secretKey: 'CHANGE_ME'
  useSSL: true
  bucket: 'evolyn'
  prefix: 'evolyn'
  presignTtlSeconds: 900
  maxUploadBytes: 1073741824
  uploadCleanupIntervalSeconds: 300

oauth:
  github:
    authType: 'github'
    clientId: 'CHANGE_ME'
    clientSecret: 'CHANGE_ME'

sms:
  # 当前仅实现 dev 通道；接入正式短信服务商后在此填写其 provider。
  provider: 'CHANGE_ME'
  codeTtlSeconds: 300
  cooldownSeconds: 60
  maxTries: 5
  dailyLimit: 10
  ipDailyLimit: 30
  devEcho: false

email:
  provider: 'smtp'
  codeTtlSeconds: 300
  cooldownSeconds: 60
  maxTries: 5
  identityTtlSeconds: 300
  devEcho: false
  smtpHost: 'CHANGE_ME'
  smtpPort: 587
  smtpUsername: 'CHANGE_ME'
  smtpPassword: 'CHANGE_ME'
  smtpFrom: 'CHANGE_ME'
  smtpImplicitTls: false

auth:
  loginMaxFails: 5
  loginLockMinutes: 15
  revokeFailClosed: true
  loginGuardSecret: 'CHANGE_ME'

pki:
  algorithm: 'rsa'
  privateKey: ''
  # 推荐在部署时写入受保护的 PEM 文件，并填写绝对路径；生产不得留空。
  privateKeyFile: ''

security:
  totp:
    currentKeyVersion: 1
    # 填写 32 字节十六进制主密钥；支持按版本追加以完成密钥轮换。
    masterKeys:
      1: 'CHANGE_ME'

# 消息中心（P1/P2）：Outbox 物化与过期清理的 Worker 节奏、保留期口径与
# 自定义提醒对象租户上限；全部零值回落内置默认。
notification:
  outboxIntervalSeconds: 5 # Outbox Worker 轮询间隔（秒）；示例：5。
  outboxBatchSize: 20 # Outbox 单轮领取事件数；示例：20（上限 200）。
  retentionIntervalSeconds: 21600 # 过期消息清理扫描周期（秒）；示例：21600（6 小时）。
  retentionBatchSize: 1000 # 清理每批行数；示例：1000（上限 5000）。
  retentionMonths: 6 # 消息保留期（月），列表/未读统计在 SQL 侧排除过期；示例：6。
  customRecipientLimit: 200 # 租户自定义提醒对象上限；示例：200。
