# evolyn-core 配置模板
# 复制为 app.yaml（本地开发）或 app.local.yaml 后按环境填写真实值，真实配置不要提交入库。

server:
  env: "debug"            # debug / release
  address: "127.0.0.1"
  port: 8080
  gracefulShutdownPeriod: 30
  rateLimits:
    - limitType: "server"
      burst: 500
      qps: 100
      cacheSize: 1
    - limitType: "ip"
      burst: 50
      qps: 10
      cacheSize: 2048
  jwtSecret: "CHANGE_ME"  # 生产环境必须替换为随机长字符串

db:
  port: 5432
  host: "localhost"
  name: "evolyn"
  user: "postgres"
  password: "postgres"
  migrate: false       # GORM AutoMigrate（仅开发/测试实验，与 migrations 互斥）
  migrations: true     # 版本化 SQL Migration（FIX-009，生产唯一 Schema 来源）

tenant:
  retentionDays: 30        # 租户注销后数据保留天数（FIX-012）
  purgeIntervalSeconds: 3600  # 注销数据清理扫描周期（秒）

redis:
  enable: true
  port: 6379
  host: "localhost"
  password: "CHANGE_ME"

oauth:
  github:
    authType: "github"
    clientId: ""
    clientSecret: ""

sms:
  # dev=开发通道（固定验证码 666666，仅日志不外发）；生产填写真实服务商标识，
  # 未支持的服务商启动即拦截（接入新服务商：实现 sms.Sender 并在 server 装配处分派）
  provider: "dev"
  codeTtlSeconds: 300  # 验证码有效期（秒）
  cooldownSeconds: 60  # 重发冷却（秒）
  maxTries: 5          # 单码最大试错次数
  dailyLimit: 10       # 单手机号自然日发送上限（跨登录/注册/找回场景合计）
  devEcho: false       # 响应回显验证码（仅本地联调可开，生产必须 false）

pki:
  # 登录密码加密传输：公钥经 GET /app/conf 下发前端（jsencrypt PKCS#1 v1.5），
  # 私钥仅服务端解密。生产用 openssl genrsa 生成 2048 位密钥并配置同一把私钥
  # （多实例必须共享）；可直接配置 privateKey，或使用相对 app.yaml 的 privateKeyFile。
  # 两者都留空则每次启动随机生成（仅开发/测试，重启即轮换）
  algorithm: "rsa"
  privateKey: ""
  privateKeyFile: ""
