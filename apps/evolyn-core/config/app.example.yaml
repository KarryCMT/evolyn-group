# evolyn-core 配置模板
# 复制为 app.yaml（本地开发）或 app.local.yaml 后按环境填写真实值，真实配置不要提交入库。

server:
  env: "debug"            # debug / release
  address: "127.0.0.1"
  port: 8080
  gracefulShutdownPeriod: 30
  rateLimits:
    - limitType: "server"
      burst: 500
      qps: 100
      cacheSize: 1
    - limitType: "ip"
      burst: 50
      qps: 10
      cacheSize: 2048
  jwtSecret: "CHANGE_ME"  # 生产环境必须替换为随机长字符串
  # CORS 来源白名单（精确匹配，含协议与端口）。生产必须显式配置实际站点域名，
  # 空白名单在 release 环境会拒绝启动；debug 空白名单回落放行 localhost/127.0.0.1
  allowedOrigins:
    - "https://www.example.com"

db:
  port: 5432
  host: "localhost"
  name: "evolyn"
  user: "postgres"
  password: "postgres"
  migrate: false       # GORM AutoMigrate（仅开发/测试实验，与 migrations 互斥）
  migrations: true     # 版本化 SQL Migration（FIX-009，生产唯一 Schema 来源）

tenant:
  retentionDays: 30        # 租户注销后数据保留天数（FIX-012）
  purgeIntervalSeconds: 3600  # 注销数据清理扫描周期（秒）

redis:
  enable: true
  port: 6379
  host: "localhost"
  password: "CHANGE_ME"

oauth:
  github:
    authType: "github"
    clientId: ""
    clientSecret: ""

sms:
  # dev=开发通道（固定验证码 666666，仅日志不外发）；生产填写真实服务商标识，
  # 未支持的服务商启动即拦截（接入新服务商：实现 sms.Sender 并在 server 装配处分派）
  provider: "dev"
  codeTtlSeconds: 300  # 验证码有效期（秒）
  cooldownSeconds: 60  # 重发冷却（秒）
  maxTries: 5          # 单码最大试错次数
  dailyLimit: 10       # 单手机号自然日发送上限（跨登录/注册/找回场景合计）
  ipDailyLimit: 30     # 单 IP 自然日发送上限（跨手机号/场景合计，防轮换手机号刷短信）
  devEcho: false       # 响应回显验证码（仅本地联调可开，生产必须 false）

auth:
  loginMaxFails: 5        # 窗口内连续登录失败上限，达到即临时锁定
  loginLockMinutes: 15    # 登录锁定时长（分钟）
  # Redis 异常时令牌吊销检查的降级策略：false=放行（可用性优先，默认）；
  # true=视为已吊销并拒绝请求（对已泄露令牌立即失效要求更高时开启，
  # 代价是 Redis 故障期间全部携带 jti 的请求 401）
  revokeFailClosed: false
  # 登录失败计数标识散列的独立密钥：非空时 HMAC-SHA-256 防字典反查
  # （Redis key 可能经监控/备份暴露，无密钥散列可被彩虹表还原手机号/
  # 常见用户名）；留空回退无密钥 SHA-256 并在 release 启动时告警，
  # 占位值 CHANGE_ME 同样视为未配置。多实例必须共享同一把
  loginGuardSecret: ""

pki:
  # 登录密码加密传输：公钥经 GET /app/conf 下发前端（jsencrypt PKCS#1 v1.5），
  # 私钥仅服务端解密。生产用 openssl genrsa 生成 2048 位密钥并配置同一把私钥
  # （多实例必须共享）；可直接配置 privateKey，或使用相对 app.yaml 的 privateKeyFile。
  # 两者都留空则每次启动随机生成（仅开发/测试，重启即轮换）
  algorithm: "rsa"
  privateKey: ""
  privateKeyFile: ""
