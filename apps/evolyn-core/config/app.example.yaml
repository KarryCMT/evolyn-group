# evolyn-core 配置模板
# 可复制为 app.local.yaml（本机开发）、app.test.yaml（测试）或 app.prod.yaml（生产）后按环境填写。
# 启动时通过 --config 指定对应文件；真实配置不要提交入库。
# 下列值均为示例；带有 CHANGE_ME 的密钥、密码和令牌必须通过未提交配置或密钥管理系统替换。

server:
  env: 'debug' # 运行环境；示例：debug（本地）或 release（生产）。
  address: '127.0.0.1' # HTTP 监听地址；示例：127.0.0.1（仅本机）或 0.0.0.0（容器部署）。
  port: 8080 # HTTP 监听端口；示例：8080。
  gracefulShutdownPeriod: 30 # 优雅停机等待秒数；示例：30。
  rateLimits: # 请求限流规则列表；示例中同时配置全局与单 IP 两个维度。
    - limitType: 'server' # 限流维度；示例：server（全局）或 ip（按客户端 IP）。
      burst: 500 # 令牌桶瞬时容量；示例：500，必须大于或等于 qps。
      qps: 100 # 稳态每秒允许请求数；示例：100。
      cacheSize: 1 # 限流器缓存容量；server 维度仅需一个实例，示例：1。
    - limitType: 'ip' # 限流维度；示例：ip，按客户端 IP 独立计数。
      burst: 50 # 单 IP 的瞬时请求容量；示例：50。
      qps: 10 # 单 IP 的稳态每秒请求数；示例：10。
      cacheSize: 2048 # 单 IP 限流器缓存容量；示例：2048，按预计活跃 IP 数调整。
  jwtSecret: 'CHANGE_ME' # JWT 签名密钥；示例为占位值，生产必须替换为随机长字符串且多实例保持一致。
  # CORS 来源白名单（精确匹配，含协议与端口）。生产必须显式配置实际站点域名，
  # 空白名单在 release 环境会拒绝启动；debug 空白名单回落放行 localhost/127.0.0.1
  allowedOrigins: # CORS 允许来源白名单，精确匹配协议、域名和端口；release 环境不能为空。
    - 'https://www.example.com' # 允许的前端来源示例；本地可填写 http://localhost:5173。

db:
  port: 5432 # PostgreSQL 端口；示例：5432。
  host: 'localhost' # PostgreSQL 主机地址；示例：localhost 或 postgres（Docker 服务名）。
  name: 'evolyn' # 数据库名称；示例：evolyn。
  user: 'postgres' # 数据库用户名；示例：postgres。
  password: 'postgres' # 数据库密码；示例为本地值，生产仅经未提交配置或密钥管理系统注入。
  migrate: false # 是否执行 GORM AutoMigrate；示例：false，仅开发/测试可设 true，且不得与 migrations 同时开启。
  migrations: true # 是否执行版本化 SQL Migration；示例：true，生产 Schema 的唯一来源。

tenant:
  retentionDays: 30 # 租户注销后数据保留天数；示例：30。
  purgeIntervalSeconds: 3600 # 注销数据清理扫描周期（秒）；示例：3600（1 小时）。

redis:
  enable: true # 是否启用 Redis；示例：true，认证会话、验证码和限流等能力依赖它。
  port: 6379 # Redis 端口；示例：6379。
  host: 'localhost' # Redis 主机地址；示例：localhost 或 redis（Docker 服务名）。
  password: 'CHANGE_ME' # Redis 认证密码；无密码本地实例可留空，生产不得使用占位值。

# RustFS 使用标准 S3 API。Endpoint 是 Go 服务可访问的内部地址；
# externalEndpoint 是浏览器实际访问的公开地址，预签名 URL 会以它为准。
# 真实 AK/SK 仅写 app.local.yaml 或环境注入配置，绝不提交。
storage:
  enabled: false # 是否启用对象存储；示例：false（未部署时关闭）或 true（启用上传）。
  endpoint: '127.0.0.1:9000' # 服务端访问的 S3 Endpoint；示例：127.0.0.1:9000，不含协议。
  externalEndpoint: 'http://127.0.0.1:9000' # 浏览器访问的 S3 Endpoint；示例：http://127.0.0.1:9000，包含协议。
  accessKey: 'CHANGE_ME' # S3 Access Key；示例为占位值，启用存储时必须替换。
  secretKey: 'CHANGE_ME' # S3 Secret Key；示例为占位值，禁止提交真实值。
  useSSL: false # 服务端连接 S3 是否使用 HTTPS；示例：false（本地 HTTP）或 true（生产 HTTPS）。
  bucket: 'evolyn' # 对象存储桶名称；示例：evolyn。
  prefix: 'evolyn' # 对象键统一前缀；示例：evolyn，留空表示不加前缀。
  presignTtlSeconds: 900 # 上传/下载预签名 URL 有效期（秒）；示例：900（15 分钟）。
  maxUploadBytes: 1073741824 # 单文件最大上传字节数；示例：1073741824（1 GiB）。
  uploadCleanupIntervalSeconds: 300 # 过期上传会话清理周期（秒）；示例：300（5 分钟）。

oauth:
  github: # OAuth 提供方标识；示例：github，键名须与后端已注册提供方一致。
    authType: 'github' # OAuth 提供方类型；示例：github。
    clientId: '' # OAuth 应用 Client ID；示例：从 GitHub OAuth App 获取，真实值仅写未提交配置。
    clientSecret: '' # OAuth 应用 Client Secret；示例：从 GitHub OAuth App 获取，禁止提交入库。

sms:
  # dev=开发通道（固定验证码 666666，仅日志不外发）；生产填写真实服务商标识，
  # 未支持的服务商启动即拦截（接入新服务商：实现 sms.Sender 并在 server 装配处分派）
  provider: 'dev' # 短信通道；示例：dev（固定验证码 666666，仅日志不外发）。
  codeTtlSeconds: 300 # 验证码有效期（秒）；示例：300（5 分钟）。
  cooldownSeconds: 60 # 同一手机号重发冷却时间（秒）；示例：60。
  maxTries: 5 # 单个验证码最大校验失败次数；示例：5，超过后验证码失效。
  dailyLimit: 10 # 单手机号自然日发送上限；示例：10，登录/注册/找回密码合计。
  ipDailyLimit: 30 # 单 IP 自然日发送上限；示例：30，用于防止轮换手机号刷短信。
  devEcho: false # 是否在接口响应中回显验证码；示例：false，生产必须保持关闭。

email:
  # dev 仅可用于 debug；release 环境必须使用 smtp，SMTP 凭据只通过未提交的
  # 部署配置注入，禁止将真实密码提交到仓库。
  provider: 'dev'
  codeTtlSeconds: 300 # 验证码有效期（秒）
  cooldownSeconds: 60 # 重发冷却（秒）
  maxTries: 5 # 单验证码最大试错次数
  identityTtlSeconds: 300 # 手机号身份验证凭证有效期（秒）
  devEcho: false # 仅本地联调可开，生产必须 false
  smtpHost: ''
  smtpPort: 587
  smtpUsername: ''
  smtpPassword: ''
  smtpFrom: ''
  smtpImplicitTls: false # 465 等隐式 TLS 端口填写 true；465 端口也会自动识别

auth:
  loginMaxFails: 5 # 连续登录失败上限；示例：5，达到后临时锁定账号。
  loginLockMinutes: 15 # 登录锁定时长（分钟）；示例：15。
  # Redis 异常时令牌吊销检查的降级策略：false=放行（可用性优先，默认）；
  # true=视为已吊销并拒绝请求（对已泄露令牌立即失效要求更高时开启，
  # 代价是 Redis 故障期间全部携带 jti 的请求 401）
  revokeFailClosed: false # Redis 异常时令牌吊销检查策略；示例：false=放行（可用性优先），true=拒绝（安全优先）。
  # 登录失败计数标识散列的独立密钥：非空时 HMAC-SHA-256 防字典反查
  # （Redis key 可能经监控/备份暴露，无密钥散列可被彩虹表还原手机号/
  # 常见用户名）；留空回退无密钥 SHA-256 并在 release 启动时告警，
  # 占位值 CHANGE_ME 同样视为未配置。多实例必须共享同一把
  loginGuardSecret: '' # 登录失败计数 HMAC 密钥；示例留空，生产使用随机密钥且多实例保持一致。

pki:
  # 登录密码加密传输：公钥经 GET /app/conf 下发前端（jsencrypt PKCS#1 v1.5），
  # 私钥仅服务端解密。生产用 openssl genrsa 生成 2048 位密钥并配置同一把私钥
  # （多实例必须共享）；可直接配置 privateKey，或使用相对 app.yaml 的 privateKeyFile。
  # 两者都留空则每次启动随机生成（仅开发/测试，重启即轮换）
  algorithm: 'rsa' # 登录密码传输加密算法；当前仅支持 rsa，示例：rsa。
  privateKey: '' # PEM 私钥内容；与 privateKeyFile 二选一，示例留空并通过未提交配置注入。
  privateKeyFile: '' # PEM 私钥文件路径；相对路径以本 YAML 所在目录为基准，示例：private_key.pem。

# 账号安全：TOTP 密钥只通过未提交的部署配置或密钥管理系统注入。新绑定使用
# currentKeyVersion；保留旧版本直到所有对应因子完成重加密/停用。release 环境
# 启用 MFA 前必须填入真实随机 32 字节 hex 密钥，示例值不可用于生产。
security:
  totp:
    currentKeyVersion: 1 # 新绑定因子使用的主密钥版本；示例：1，轮换后递增。
    masterKeys: # 主密钥版本映射；保留旧版本直到对应因子完成重加密或停用。
      1: 'CHANGE_ME' # 版本 1 的 32 字节十六进制主密钥示例占位值；生产必须替换。

# 消息中心（P1/P2）：Outbox 物化与过期清理的 Worker 节奏、保留期口径与
# 自定义提醒对象租户上限；全部零值回落内置默认。
notification:
  outboxIntervalSeconds: 5 # Outbox Worker 轮询间隔（秒）；示例：5。
  outboxBatchSize: 20 # Outbox 单轮领取事件数；示例：20（上限 200）。
  retentionIntervalSeconds: 21600 # 过期消息清理扫描周期（秒）；示例：21600（6 小时）。
  retentionBatchSize: 1000 # 清理每批行数；示例：1000（上限 5000）。
  retentionMonths: 6 # 消息保留期（月），列表/未读统计在 SQL 侧排除过期；示例：6。
  customRecipientLimit: 200 # 租户自定义提醒对象上限；示例：200。
