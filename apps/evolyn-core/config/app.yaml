server:
  env: "debug"
  address: "127.0.0.1"
  port: 8080
  gracefulShutdownPeriod: 30
  rateLimits:
    - limitType: "server"
      burst: 500
      qps: 100
      cacheSize: 1
    - limitType: "ip"
      burst: 50
      qps: 10
      cacheSize: 2048
  jwtSecret: weaveserver



db:
  port: 5432
  host: "127.0.0.1"
  name: "evolyn"
  user: "postgres"
  password: "postgres"
  migrate: false      # AutoMigrate 仅开发/测试（FIX-009）
  migrations: true    # 启动时应用 migrations/ 版本化 SQL

tenant:
  retentionDays: 30
  purgeIntervalSeconds: 3600

redis:
  enable: true
  port: 6379
  host: "localhost"
  password: "123456"

oauth:
  github:
    clientId: "85db232fde2c9320ece7" # set your client id
    clientSecret: "" # set your client secret
