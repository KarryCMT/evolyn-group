server:
  env: "debug"
  address: "127.0.0.1"
  port: 8080
  gracefulShutdownPeriod: 30
  rateLimits:
    - limitType: "server"
      burst: 500
      qps: 100
      cacheSize: 1
    - limitType: "ip"
      burst: 50
      qps: 10
      cacheSize: 2048
  jwtSecret: evolyn-dev-secret



db:
  port: 5432
  host: "127.0.0.1"
  name: "evolyn"
  user: "postgres"
  password: "postgres"
  migrate: false      # AutoMigrate 仅开发/测试（FIX-009）
  migrations: true    # 启动时应用 migrations/ 版本化 SQL

tenant:
  retentionDays: 30
  purgeIntervalSeconds: 3600

redis:
  enable: true
  port: 6379
  host: "localhost"
  password: "123456"

oauth:
  github:
    clientId: "85db232fde2c9320ece7" # set your client id
    clientSecret: "" # set your client secret

sms:
  provider: "dev"      # dev=开发通道（固定验证码 666666，仅日志不外发）；生产接服务商后替换，未支持的服务商启动即拦截
  codeTtlSeconds: 300  # 验证码有效期 5 分钟
  cooldownSeconds: 60  # 重发冷却 60 秒
  maxTries: 5          # 单码最大试错次数
  dailyLimit: 10       # 单手机号自然日发送上限（跨登录/注册/找回场景合计）
  devEcho: true        # 响应回显验证码（仅本地联调，生产必须 false）

pki:
  algorithm: "rsa"                    # 登录密码加密算法：公钥经 GET /app/conf 下发前端
  privateKey: ""                      # PEM 私钥；与 privateKeyFile 二选一；空 = 启动随机生成
  privateKeyFile: "private_key.pem"   # PEM 私钥文件，相对 app.yaml 所在目录；公钥从私钥派生
