# 自动化测试与测试环境配置。字段定义、顺序与填写说明统一以 app.example.yaml 为准。
# 测试数据库应与开发数据库隔离。
server:
  env: 'test'
  address: '127.0.0.1'
  port: 8081
  gracefulShutdownPeriod: 5
  rateLimits:
    - limitType: 'server'
      burst: 1000
      qps: 500
      cacheSize: 1
  jwtSecret: 'evolyn-test-secret'
  allowedOrigins:
    - 'http://localhost:11007'

db:
  host: '127.0.0.1'
  port: 5432
  name: 'evolyn_test'
  user: 'postgres'
  password: 'postgres'
  migrate: false
  migrations: true

tenant:
  retentionDays: 1
  purgeIntervalSeconds: 60

redis:
  enable: false
  host: '127.0.0.1'
  port: 6379
  password: ''

storage:
  enabled: false
  endpoint: ''
  externalEndpoint: ''
  accessKey: ''
  secretKey: ''
  useSSL: false
  bucket: ''
  prefix: 'evolyn-test'
  presignTtlSeconds: 60
  maxUploadBytes: 10485760
  uploadCleanupIntervalSeconds: 60

oauth:
  github:
    authType: 'github'
    clientId: ''
    clientSecret: ''

sms:
  provider: 'dev'
  codeTtlSeconds: 300
  cooldownSeconds: 1
  maxTries: 5
  dailyLimit: 100
  ipDailyLimit: 100
  devEcho: true

email:
  provider: 'dev'
  codeTtlSeconds: 300
  cooldownSeconds: 1
  maxTries: 5
  identityTtlSeconds: 300
  devEcho: true
  smtpHost: ''
  smtpPort: 587
  smtpUsername: ''
  smtpPassword: ''
  smtpFrom: ''
  smtpImplicitTls: false

auth:
  loginMaxFails: 5
  loginLockMinutes: 1
  revokeFailClosed: false
  loginGuardSecret: 'evolyn-test-login-guard-secret'

pki:
  algorithm: 'rsa'
  privateKey: ''
  privateKeyFile: ''

security:
  totp:
    currentKeyVersion: 1
    masterKeys:
      1: 'CHANGE_ME'

# 消息中心（P1/P2）：Outbox 物化与过期清理的 Worker 节奏、保留期口径与
# 自定义提醒对象租户上限；全部零值回落内置默认。
notification:
  outboxIntervalSeconds: 5 # Outbox Worker 轮询间隔（秒）；示例：5。
  outboxBatchSize: 20 # Outbox 单轮领取事件数；示例：20（上限 200）。
  retentionIntervalSeconds: 21600 # 过期消息清理扫描周期（秒）；示例：21600（6 小时）。
  retentionBatchSize: 1000 # 清理每批行数；示例：1000（上限 5000）。
  retentionMonths: 6 # 消息保留期（月），列表/未读统计在 SQL 侧排除过期；示例：6。
  customRecipientLimit: 200 # 租户自定义提醒对象上限；示例：200。
