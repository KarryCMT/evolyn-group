# evolyn-core 后端 lint 配置（golangci-lint v2 schema）。
# 由 v1 配置经 `golangci-lint migrate` 迁移并显式化：
#   - exportloopref 已随 Go 1.22 loopvar 语义从 v2 移除（场景由语言自身解决）；
#   - typecheck 在 v2 恒启用，不再显式声明；
#   - gofmt/goimports 在 v2 归入 formatters 段；
#   - depguard 在 v2 裸启用默认「仅放行标准库」，必须显式声明规则——本域
#     只机检一条架构铁律：engine 纯内核禁依赖 gin/gorm/redis/net-http
#     （ADR-012，平台能力一律经 provider 窄端口注入，见 AGENTS.md）；
#   - gocyclo 阈值 35 与仓库根 .golangci.yml 的 cyclop max-complexity 对齐。
version: "2"
run:
  concurrency: 4

linters:
  default: none
  enable:
    - asciicheck
    - depguard
    - dogsled
    - gocyclo
    - goprintffuncname
    - importas
    - misspell
    - nakedret
    - nilerr
    - nolintlint
    - unconvert
  settings:
    gocyclo:
      min-complexity: 35
    nolintlint:
      # nolint 必须指明具体 linter 并携带理由（机器可读 + 可评审）
      require-explanation: true
      require-specific: true
    depguard:
      rules:
        engine-purity:
          files:
            - "**/internal/engine/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: 引擎内核禁依赖 gin（ADR-012：HTTP 面在 platform/workflow 薄壳）
            - pkg: gorm.io
              desc: 引擎内核禁依赖 gorm（持久化经 repository SPI 由 platform 层适配）
            - pkg: github.com/redis
              desc: 引擎内核禁依赖 redis
            - pkg: net/http
              desc: 引擎内核禁直接出站 HTTP（service 节点经 ServiceInvoker 窄端口）
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
